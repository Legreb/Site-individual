<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Chronos Network | Cadastro</title>

  <script src="./js/sessao.js"></script>

  <link rel="stylesheet" href="./css/estilo.css" />
  <link rel="icon" href="./assets/icon/favicon2.ico" />
  <link rel="preconnect" href="https://fonts.gstatic.com" />
</head>

<body>
  <!-- HEADER / NAVBAR -->
  <div class="header">
    <div class="container">
      <h1 class="titulo">
        <a href="index.html">
          <img src="assets/imgs/logo.png" width="200" height="130" alt="Logo">
        </a>
      </h1>
      <ul class="navbar">
        <li>
          <a href="index.html"> <img src="assets/imgs/fita1.png" width="125" height="25" alt="fita1"></a>
        </li>
        <li>
          <a href="index.html#lore"><img src="assets/imgs/fita2.png" width="125" height="25" alt="fita2"></a>
        </li>
        <li>
          <a href="login.html"><img src="assets/imgs/fita3.png" width="125" height="25" alt="fita3"></a>
        </li>
        <li class="agora">
          <a href="#"><img src="assets/imgs/fita4.png" width="125" height="25" alt="fita4"></a>
        </li>
      </ul>
    </div>
  </div>

  <!-- CONTAINER DO FORMULÁRIO -->
  <div class="login">
    <div class="alerta_erro">
      <div class="card_erro" id="cardErro">
        <span id="mensagem_erro"></span>
      </div>
    </div>
    <div class="container">
      <div class="card card-cadastro">
        <h2>Bem-vindo!</h2>
        <div class="formulario">
          <div class="campo">
            <span>Nome:</span>
            <input id="nome_input" type="text" placeholder="Seu nome" />
          </div>
          <div class="campo">
            <span>E-mail:</span>
            <input id="email_input" type="email" placeholder="meuemail@provedor.com" />
          </div>
          <div class="campo">
            <span>Senha:</span>
            <input id="senha_input" type="password" placeholder="******" />
          </div>
          <div class="campo">
            <span>Confirmação da Senha:</span>
            <input id="confirmacao_senha_input" type="password" placeholder="******" />
          </div>
          <button class="botao" onclick="cadastrar()">Cadastrar</button>
        </div>

        <div id="div_aguardar" class="loading-div">
          <img src="./assets/circle-loading.gif" id="loading-gif" />
        </div>

        <div id="div_erros_login"></div>
      </div>
    </div>
  </div>

  <!-- FOOTER
  <div class="footer">
    <div class="container">
      <h4>Desenvolvido por um fã de Katana ZERO &hearts; SPTech &copy; 2026</h4>
    </div>
  </div> -->

<script>
  function cadastrar() {
    var nomeVar = nome_input.value;
    var emailVar = email_input.value;
    var senhaVar = senha_input.value;
    var confirmacaoSenhaVar = confirmacao_senha_input.value;

    // Verificando se há algum campo em branco
    if (
      nomeVar == "" ||
      emailVar == "" ||
      senhaVar == "" ||
      confirmacaoSenhaVar == ""
    ) {
      cardErro.style.display = "block";
      mensagem_erro.innerHTML = "Por favor, preencha todos os campos!";
      return false;
    } 
    
    // Verificando se as senhas coincidem
    if (senhaVar != confirmacaoSenhaVar) {
      cardErro.style.display = "block";
      mensagem_erro.innerHTML = "As senhas digitadas não coincidem!";
      return false;
    }

    // Enviando os dados do formulário para o backend
    fetch("/usuarios/cadastrar", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
      },
      body: JSON.stringify({
        nomeServer: nomeVar,
        emailServer: emailVar,
        senhaServer: senhaVar
      }),
    })
      .then(function (resposta) {
        console.log("resposta: ", resposta);

        if (resposta.ok) {
          cardErro.style.display = "block";
          mensagem_erro.innerHTML = "Cadastro realizado com sucesso! Redirecionando para a tela de Login...";

          setTimeout(() => {
            window.location = "login.html";
          }, 2000);

        } else {
          throw "Houve um erro ao tentar realizar o cadastro!";
        }
      })
      .catch(function (resposta) {
        console.log(`#ERRO: ${resposta}`);
      });

    return false;
  }

  function sumirMensagem() {
    cardErro.style.display = "none";
  }

  // EFEITOS SONOROS NAS FITAS DA NAVBAR
  const passa = new Audio('assets/sons/passa.wav');
  const escolhe = new Audio('assets/sons/escolhe.wav');
  passa.volume = 0.5;
  escolhe.volume = 0.5;

  const botoes = document.querySelectorAll('.navbar a');
  botoes.forEach(botao => {
    botao.addEventListener('mouseenter', () => {
      passa.currentTime = 0;
      passa.play().catch(() => {});
    });
    botao.addEventListener('click', () => {
      escolhe.currentTime = 0;
      escolhe.play().catch(() => {});
    });
  });
</script>
</body>

</html>
